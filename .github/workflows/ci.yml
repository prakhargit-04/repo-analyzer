name: GitHub Project Analyzer CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout

      - name: Check repo hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Run deterministic backend test suite
        run: python -m pytest tests/ -q --timeout=120 --durations=20 --tb=short

  windows-cache-regression:
    name: Windows cache and worker regression tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # Install the packages needed by the targeted cache/worker tests. The
      # test paths control external analyzers, so Windows does not need the
      # Semgrep CLI or any live-AI provider packages.
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest tree_sitter==0.21.3 tree_sitter_languages==1.10.2 radon lizard networkx sqlalchemy alembic fastapi uvicorn pydantic httpx

      - name: Verify atomic cache writes on Windows
        run: python -m pytest tests/test_ingestion_hardening.py -q -k "atomic_cache" --tb=short

      - name: Verify worker/cache-hit integration on Windows
        run: python -m pytest tests/test_s18_integration.py::test_job_submission_and_cache_hit_flow -q --tb=short

  frontend:
    name: Frontend tests, types, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  analyzer-smoke:
    name: Live analyzer baseline (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run live analyzer baseline
        run: python pipeline/main.py --local-path . --out local_output.json
