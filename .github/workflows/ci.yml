name: GitHub Project Analyzer CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-timeout pyflakes pip-audit

      - name: Check repo hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Run cache mutation checks
        run: python scripts/run_cache_mutation_checks.py

      - name: Lint core pipeline modules (pyflakes)
        run: python -m pyflakes pipeline/main.py pipeline/parser_interface.py pipeline/graph_builder.py

      - name: Security audit Python dependencies (pip-audit)
        run: |
          python -m pip_audit -r requirements.txt --format json -o pip-audit-report.json || true
          cat pip-audit-report.json
          python -c '
          import json, sys
          try:
              with open("pip-audit-report.json") as f:
                  data = json.load(f)
              high_crit = []
              for dep in data.get("dependencies", []):
                  for vuln in dep.get("vulns", []):
                      desc = str(vuln).upper()
                      if "CRITICAL" in desc or "HIGH" in desc:
                          high_crit.append(vuln)
              if high_crit:
                  print(f"Blocking on {len(high_crit)} HIGH/CRITICAL vulnerabilities found by pip-audit!", file=sys.stderr)
                  sys.exit(1)
              print("pip-audit passed: No HIGH or CRITICAL vulnerabilities found.")
          except Exception as e:
              print(f"pip-audit report evaluation note: {e}")
          '

      - name: Run deterministic backend test suite
        run: python -m pytest tests/ -q --timeout=120 --durations=20 --tb=short

  postgres-test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repoanalyzer
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: repoanalyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest psycopg2-binary alembic

      - name: Run Alembic migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://repoanalyzer:changeme@localhost:5432/repoanalyzer
        run: alembic upgrade head

      - name: Run migration and DB tests against PostgreSQL
        env:
          DATABASE_URL: postgresql://repoanalyzer:changeme@localhost:5432/repoanalyzer
        run: python -m pytest tests/test_migrations.py tests/test_migration_0008.py -q --tb=short

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Build and start Docker Compose services
        run: docker compose up -d --build

      - name: Wait for services to be healthy and curl health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/v1/health | grep -q '"status":"ok"'; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done
          # Test frontend HTTP response
          curl -fs http://localhost:3000/ || exit 1

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v

  windows-cache-regression:
    name: Windows cache and worker regression tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest tree_sitter==0.21.3 tree_sitter_languages==1.10.2 radon lizard networkx sqlalchemy alembic fastapi uvicorn pydantic httpx

      - name: Verify atomic cache writes on Windows
        run: python -m pytest tests/test_ingestion_hardening.py -q -k "atomic_cache" --tb=short

      - name: Verify worker/cache-hit integration on Windows
        run: python -m pytest tests/test_s18_integration.py::test_job_submission_and_cache_hit_flow -q --tb=short

  frontend:
    name: Frontend tests, types, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  analyzer-smoke:
    name: Live analyzer baseline (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run live analyzer baseline
        run: python pipeline/main.py --local-path . --out local_output.json
