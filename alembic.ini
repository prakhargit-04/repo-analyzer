[alembic]
# Path to migration scripts
script_location = pipeline/db/migrations

# Template for migration file names: revisionid_slug.py
file_template = %%(rev)s_%%(slug)s

# Timezone used when generating migration file timestamps
timezone = UTC

# SQLAlchemy database URL -- override with DATABASE_URL env var or set here
sqlalchemy.url = sqlite:///repo_analyzer.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
